<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Agent · A 股研究工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
  <script type="module" src="/market.js"></script>
</head>
<body>
<header><div class="brand">FINANCE <span>AGENT</span></div><span class="local">本地工作台</span></header>
<main>
  <section class="research" aria-labelledby="research-title">
    <div class="intro"><p class="eyebrow">A 股研究</p><h1 id="research-title">个股行情</h1></div>
    <section class="card" aria-labelledby="stock-name">
      <form id="stock-form" class="stock-search">
        <label for="stock-query">股票名称或代码</label>
        <input id="stock-query" maxlength="40" autocomplete="off" placeholder="例如 宁德时代 / 300750" required>
        <button>搜索</button>
      </form>
      <p id="search-status" role="status"></p>
      <div class="search-results" id="results-list"></div>
      <div class="stock-controls" aria-label="分析关注股票">
        <button type="button" class="secondary" data-stock="sh603893">瑞芯微 603893</button>
        <button type="button" class="secondary" data-stock="sz002475">立讯精密 002475</button>
        <button type="button" class="secondary" data-stock="sz002009">天奇股份 002009</button>
      </div>
      <div class="quote-line"><h2 id="stock-name">瑞芯微</h2><span id="stock-code" class="engine">SH603893</span><strong id="price">—</strong><span id="change"></span></div>
      <p id="chart-status" role="status">正在读取行情</p>
      <div class="stock-controls"><label for="range">日 K · 未复权</label><select id="range"><option value="30">30 日</option><option value="60" selected>60 日</option><option value="120">120 日</option></select></div>
      <canvas id="candles" role="img" aria-label="未复权日 K 线与成交量，涨红跌绿"></canvas>
      <p id="candle-info"></p>
      <p>红涨绿跌 · 圆点标记收盘价变化达到 ±3% 的交易日</p>
      <div class="stock-controls"><label for="day">交易日</label><select id="day"></select><button type="button" id="explain" disabled>分析波动</button></div>
    </section>
    <details class="card"><summary>数据审计与基准实验</summary>
    <p id="cutoff">正在读取本地报告</p>
    <div class="stats" id="stats"></div>
    <section class="card"><div class="card-heading"><h2>基准实验</h2><button id="refresh" class="secondary" type="button">刷新报告</button></div>
      <p id="experiment-status">正在读取</p>
      <div class="table-scroll"><table><thead><tr><th scope="col">周期</th><th scope="col">样本数</th><th scope="col">行情 Brier</th><th scope="col">加入事件</th></tr></thead><tbody id="results"></tbody></table></div>
    </section>
    <section class="card"><h2>行情审计</h2><p id="audit-status">正在读取</p><div class="table-scroll"><table><thead><tr><th scope="col">证券</th><th scope="col">日线</th><th scope="col">缺日</th><th scope="col">跨源差异</th></tr></thead><tbody id="symbols"></tbody></table></div></section>
    </details>
  </section>
  <section class="chat card" aria-labelledby="chat-title">
    <div class="card-heading"><h2 id="chat-title">研究助手</h2><span class="engine">Codex</span></div>
    <div id="evidence" aria-live="polite">点击 K 线或选择交易日，查看当日证据。</div>
    <div class="messages" id="messages" role="log" aria-label="对话记录"></div>
    <div class="suggestions"><button class="secondary" type="button" data-prompt="读取最近一次实验，比较 5 日与 20 日模型的表现。">解读基准实验</button><button class="secondary" type="button" data-prompt="读取数据审计，说明公告覆盖和行情质量。">检查数据覆盖</button></div>
    <form id="chat-form"><label for="message">给研究助手发消息</label><div class="composer"><textarea id="message" required maxlength="8000" rows="2" placeholder="问一个研究问题，或要求运行实验"></textarea><button id="send">发送</button></div><p id="status" role="status"></p></form>
  </section>
</main>
</body>
</html>
